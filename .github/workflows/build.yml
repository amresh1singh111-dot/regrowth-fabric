name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: regrowth-fabric-26.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: regrowth-jar
          path: regrowth-fabric-26.3/build/libs/*.jar
